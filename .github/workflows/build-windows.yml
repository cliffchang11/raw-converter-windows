name: 🏗️ Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號 (例：1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        shell: pwsh
        run: pip install customtkinter pyinstaller pillow --upgrade

      - name: 🔧 Download ExifTool for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          
          # 動態取得 ExifTool 最新版本號
          try {
            $page = Invoke-WebRequest -Uri "https://exiftool.org" -UseBasicParsing -TimeoutSec 30
            $match = [regex]::Match($page.Content, 'exiftool-(\d+\.\d+)\.zip')
            if ($match.Success) {
              $latestVer = $match.Groups[1].Value
              Write-Host "Latest ExifTool version: $latestVer"
              $primaryUrl = "https://exiftool.org/exiftool-$latestVer.zip"
            } else {
              $primaryUrl = "https://exiftool.org/exiftool-13.05.zip"
            }
          } catch {
            $primaryUrl = "https://exiftool.org/exiftool-13.05.zip"
          }
          
          $urls = @($primaryUrl, "https://exiftool.org/exiftool-13.00.zip", "https://exiftool.org/exiftool-12.99.zip")
          $downloaded = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Trying: $url"
              Invoke-WebRequest -Uri $url -OutFile "assets\exiftool.zip" -UseBasicParsing -TimeoutSec 60
              $downloaded = $true
              Write-Host "Downloaded OK from: $url"
              break
            } catch {
              Write-Host "Failed ($url): $_"
            }
          }
          if (-not $downloaded) { Write-Error "All ExifTool URLs failed!"; exit 1 }
          
          Expand-Archive -Path "assets\exiftool.zip" -DestinationPath "assets\tmp" -Force
          $exe = Get-ChildItem "assets\tmp" -Recurse -Include "*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "assets\exiftool.exe"
            Write-Host "ExifTool ready: $((Get-Item 'assets\exiftool.exe').Length) bytes"
          } else {
            Write-Error "No .exe found in ExifTool archive!"
            exit 1
          }
          Remove-Item "assets\exiftool.zip" -Force
          Remove-Item "assets\tmp" -Recurse -Force


      - name: 🔨 Build .exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "RAW_Converter" `
            --add-data "assets/exiftool.exe;assets" `
            --clean `
            --noconfirm `
            raw_converter.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "PyInstaller complete. Files in dist/:"
          Get-ChildItem dist/

      - name: 📥 Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          # 確認安裝成功
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup ready: $iscc"
          } else {
            Write-Error "Inno Setup not found after install!"
            exit 1
          }

      - name: 📦 Compile Windows Installer
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version -or $version -eq "") { $version = "1.0.0" }
          Write-Host "Building version: $version"
          
          # 更新 installer.iss 版本號與輸出檔名
          $content = Get-Content installer.iss -Raw
          $content = $content -replace 'AppVersion=.*', "AppVersion=$version"
          $content = $content -replace 'OutputBaseFilename=.*', "OutputBaseFilename=RAW_Converter_Setup_v$version"
          # 同步更新 .exe 名稱（PyInstaller 輸出為 RAW_Converter.exe）
          $content = $content -replace 'Source: "dist\\RAW轉檔工具\.exe"', 'Source: "dist\RAW_Converter.exe"'
          Set-Content installer.iss $content
          
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup compile failed!"; exit 1 }
          
          Write-Host "Installer files:"
          Get-ChildItem installer_output/

      - name: 📤 Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAW-Converter-Windows-Installer
          path: installer_output/*.exe
          retention-days: 30

      - name: 🚀 Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "RAW 批次轉檔工具 ${{ github.ref_name }}"
          body: |
            ## 📷 RAW 批次轉檔工具 Windows 版

            ### 安裝方式
            1. 下載下方的 `RAW_Converter_Setup_*.exe`
            2. 雙擊執行，依精靈步驟安裝
            3. 完成！桌面會出現捷徑，無需額外安裝任何軟體

            ### 支援格式
            `.NEF` `.CR2` `.CR3` `.ARW` `.DNG` `.ORF` `.RAF` `.RW2` `.PEF` `.SR2`

            ### 系統需求
            Windows 10 / 11 (64位元)
          files: installer_output/*.exe
