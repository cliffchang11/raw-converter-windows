name: 🏗️ Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號 (例：1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        shell: pwsh
        run: pip install customtkinter pyinstaller pillow --upgrade

      - name: 🔧 Install ExifTool via Chocolatey
        shell: pwsh
        run: |
          # Chocolatey 在 GitHub Actions Windows runner 上已預裝，直接安裝 ExifTool
          choco install exiftool --yes --no-progress
          
          # 找到 chocolatey 安裝的 exiftool.exe 並複製到 assets/
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          $exiftoolPath = (Get-Command exiftool -ErrorAction SilentlyContinue).Source
          if (-not $exiftoolPath) {
            $exiftoolPath = "C:\ProgramData\chocolatey\bin\exiftool.exe"
          }
          if (Test-Path $exiftoolPath) {
            Copy-Item $exiftoolPath -Destination "assets\exiftool.exe"
            Write-Host "ExifTool ready at: $exiftoolPath"
            Write-Host "Size: $((Get-Item 'assets\exiftool.exe').Length) bytes"
          } else {
            Write-Error "exiftool.exe not found after choco install!"
            exit 1
          }

      - name: 🔨 Build .exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "RAW_Converter" `
            --add-data "assets/exiftool.exe;assets" `
            --clean `
            --noconfirm `
            raw_converter.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "PyInstaller complete. Files in dist/:"
          Get-ChildItem dist/

      - name: 📥 Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          # 確認安裝成功
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup ready: $iscc"
          } else {
            Write-Error "Inno Setup not found after install!"
            exit 1
          }

      - name: 📦 Compile Windows Installer
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version -or $version -eq "") { $version = "1.0.0" }
          Write-Host "Building version: $version"
          
          # 更新 installer.iss 版本號與輸出檔名
          $content = Get-Content installer.iss -Raw
          $content = $content -replace 'AppVersion=.*', "AppVersion=$version"
          $content = $content -replace 'OutputBaseFilename=.*', "OutputBaseFilename=RAW_Converter_Setup_v$version"
          # 同步更新 .exe 名稱（PyInstaller 輸出為 RAW_Converter.exe）
          $content = $content -replace 'Source: "dist\\RAW轉檔工具\.exe"', 'Source: "dist\RAW_Converter.exe"'
          Set-Content installer.iss $content
          
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup compile failed!"; exit 1 }
          
          Write-Host "Installer files:"
          Get-ChildItem installer_output/

      - name: 📤 Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAW-Converter-Windows-Installer
          path: installer_output/*.exe
          retention-days: 30

      - name: 🚀 Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "RAW 批次轉檔工具 ${{ github.ref_name }}"
          body: |
            ## 📷 RAW 批次轉檔工具 Windows 版

            ### 安裝方式
            1. 下載下方的 `RAW_Converter_Setup_*.exe`
            2. 雙擊執行，依精靈步驟安裝
            3. 完成！桌面會出現捷徑，無需額外安裝任何軟體

            ### 支援格式
            `.NEF` `.CR2` `.CR3` `.ARW` `.DNG` `.ORF` `.RAF` `.RW2` `.PEF` `.SR2`

            ### 系統需求
            Windows 10 / 11 (64位元)
          files: installer_output/*.exe
