name: 🏗️ Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號 (例：1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        shell: pwsh
        run: pip install customtkinter pyinstaller pillow --upgrade

      - name: 🔧 Download Standalone ExifTool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          
          # 動態解析官網最新 64-bit 版本下載路徑，若為 SourceForge 則自動轉換為 CDN 直連網址防止下載到 HTML 倒數頁面
          Write-Host "Fetching latest ExifTool download link from exiftool.org..."
          try {
              $html = Invoke-WebRequest -Uri "https://exiftool.org/" -UseBasicParsing -TimeoutSec 15
              $link = ($html.Links | Where-Object { $_.href -like "*exiftool-*_64.zip*" } | Select-Object -First 1).href
              if ($link) {
                  if ($link.Contains("sourceforge.net")) {
                      # 轉換 SourceForge 下載頁連結為直連網址，只替換結尾的 /download
                      $url = $link.Replace("https://sourceforge.net/projects/", "https://downloads.sourceforge.net/project/")
                      $url = $url.Replace("/files/", "/")
                      $url = $url -replace "/download$", ""
                  } elseif ($link.StartsWith("http")) {
                      $url = $link
                  } else {
                      $url = "https://exiftool.org/$link"
                  }
              } else {
                  Write-Host "Failed to parse link from HTML. Falling back to SourceForge 13.59"
                  $url = "https://downloads.sourceforge.net/project/exiftool/exiftool-13.59_64.zip"
              }
          } catch {
              Write-Host "Network error while parsing page. Falling back to SourceForge 13.59"
              $url = "https://downloads.sourceforge.net/project/exiftool/exiftool-13.59_64.zip"
          }
          
          $zip = "assets\exiftool_tmp.zip"
          Write-Host "Downloading ExifTool from $url..."
          curl.exe -L -o $zip $url
          Write-Host "Extracting ExifTool..."
          Expand-Archive -Path $zip -DestinationPath "assets\exiftool_tmp" -Force
          
           # 尋找解壓後包含 exiftool(-k).exe 的檔案並複製為 assets/exiftool.exe
          $sourceExe = Get-ChildItem "assets\exiftool_tmp" -Recurse -Filter "exiftool(-k).exe" | Select-Object -First 1
          if ($sourceExe) {
            Copy-Item $sourceExe.FullName -Destination "assets\exiftool.exe"
            
            # 複製 64 位元運行所需的 Perl 運行庫目錄
            $sourceDir = $sourceExe.Directory.FullName
            $sourceFilesFolder = Join-Path $sourceDir "exiftool_files"
            if (Test-Path $sourceFilesFolder) {
              Copy-Item -Path $sourceFilesFolder -Destination "assets\exiftool_files" -Recurse -Force
              Write-Host "exiftool_files folder copied successfully!"
            } else {
              Write-Host "Warning: exiftool_files folder not found next to exiftool(-k).exe"
            }
            
            Remove-Item $zip -Force
            Remove-Item "assets\exiftool_tmp" -Recurse -Force
            Write-Host "Standalone ExifTool ready!"
            Write-Host "Size: $((Get-Item 'assets\exiftool.exe').Length) bytes"
          } else {
            Write-Error "exiftool(-k).exe not found in downloaded zip!"
            exit 1
          }

      - name: 🔨 Build .exe with PyInstaller
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "RAW_Converter" `
            --add-data "assets/exiftool.exe;assets" `
            --add-data "assets/exiftool_files;assets/exiftool_files" `
            --clean `
            --noconfirm `
            raw_converter.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "PyInstaller complete. Files in dist/:"
          Get-ChildItem dist/

      - name: 📥 Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          # 確認安裝成功
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup ready: $iscc"
          } else {
            Write-Error "Inno Setup not found after install!"
            exit 1
          }

      - name: 📦 Compile Windows Installer
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version -or $version -eq "") {
              $refName = "${{ github.ref_name }}"
              if ($refName -like "v*") {
                  $version = $refName.Substring(1)
              } else {
                  $version = $refName
              }
          }
          if (-not $version -or $version -eq "") { $version = "1.0.0" }
          Write-Host "Building version: $version"
          
          # 更新 installer.iss 版本號與輸出檔名
          $content = Get-Content installer.iss -Raw
          $content = $content -replace 'AppVersion=.*', "AppVersion=$version"
          $content = $content -replace 'OutputBaseFilename=.*', "OutputBaseFilename=RAW_Converter_Setup_v$version"
          # 同步更新 .exe 名稱（PyInstaller 輸出為 RAW_Converter.exe）
          $content = $content -replace 'Source: "dist\\RAW轉檔工具\.exe"', 'Source: "dist\RAW_Converter.exe"'
          Set-Content installer.iss $content
          
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup compile failed!"; exit 1 }
          
          Write-Host "Installer files:"
          Get-ChildItem installer_output/

      - name: 📤 Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAW-Converter-Windows-Installer
          path: installer_output/*.exe
          retention-days: 30

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 當手動觸發時使用輸入的版本號，否則使用 tag 名稱
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: "RAW 批次轉檔工具 ${{ github.event.inputs.version || github.ref_name }}"
          body: |
            ## 📷 RAW 批次轉檔工具 Windows 版

            ### 安裝方式
            1. 下載下方的 `RAW_Converter_Setup_*.exe`
            2. 雙擊執行，依精靈步驟安裝
            3. 完成！桌面會出現捷徑，無需額外安裝任何軟體

            ### 支援格式
            `.NEF` `.CR2` `.CR3` `.ARW` `.DNG` `.ORF` `.RAF` `.RW2` `.PEF` `.SR2`

            ### 系統需求
            Windows 10 / 11 (64位元)
          files: installer_output/*.exe
          draft: false
          prerelease: false

