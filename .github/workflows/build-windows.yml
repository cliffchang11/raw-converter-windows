name: 🏗️ Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本號 (例：1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: pip install customtkinter pyinstaller pillow --upgrade

      - name: 🔧 Download ExifTool
        run: |
          $url = "https://exiftool.org/exiftool-13.05_64.zip"
          $zip = "assets\exiftool_tmp.zip"
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "assets\tmp" -Force
          $src = Get-ChildItem "assets\tmp" -Recurse -Filter "exiftool(-k).exe" | Select-Object -First 1
          if ($src) {
            Copy-Item $src.FullName -Destination "assets\exiftool.exe"
            Write-Host "ExifTool OK: $((Get-Item 'assets\exiftool.exe').Length) bytes"
          } else {
            Write-Error "exiftool(-k).exe not found in archive!"
            exit 1
          }
          Remove-Item $zip -Force
          Remove-Item "assets\tmp" -Recurse -Force

      - name: 🔨 Build .exe with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "RAW轉檔工具" `
            --add-data "assets/exiftool.exe;assets" `
            --clean `
            --noconfirm `
            raw_converter.py

      - name: 📥 Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
        shell: cmd

      - name: 📦 Compile Windows Installer
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = "1.0.0" }
          # 更新版本號
          (Get-Content installer.iss) `
            -replace 'AppVersion=.*', "AppVersion=$version" `
            -replace 'OutputBaseFilename=.*', "OutputBaseFilename=RAW轉檔工具_Setup_v$version" |
            Set-Content installer.iss
          New-Item -ItemType Directory -Force -Path installer_output | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed!"; exit 1 }

      - name: 📤 Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAW轉檔工具-Windows-Installer
          path: installer_output/*.exe
          retention-days: 30

      - name: 🚀 Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "RAW 批次轉檔工具 ${{ github.ref_name }}"
          body: |
            ## 📷 RAW 批次轉檔工具 Windows 版

            ### 安裝方式
            1. 下載下方的 `RAW轉檔工具_Setup_*.exe`
            2. 雙擊執行，依精靈步驟安裝
            3. 完成！桌面會出現捷徑，無需額外安裝任何軟體

            ### 支援格式
            `.NEF` `.CR2` `.CR3` `.ARW` `.DNG` `.ORF` `.RAF` `.RW2` `.PEF` `.SR2`

            ### 系統需求
            Windows 10 / 11 (64位元)
          files: installer_output/*.exe
